name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Déclenche le workflow uniquement pour la branche main
  schedule:
    - cron: "*/10 * * * *" # Rafraîchit les données toutes les 10 minutes
  workflow_dispatch:

permissions:
  contents: write # Nécessaire pour publier sur GitHub Pages

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Vérifie le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Installe Node.js (si vous utilisez des dépendances npm ou un framework JavaScript)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20" # Spécifiez la version Node.js

      # 3. Installer les dépendances (si nécessaire)
      - name: Install dependencies
        run: npm install

      # 4. Récupérer les données de hauteur d'eau (évite le CORS en prod : fetch côté CI, servi en statique)
      - name: Fetch height data
        run: |
          mkdir -p public/data
          curl -sSL --fail "https://www.vigicrues.gouv.fr/services/observations.json/index.php?CdStationHydro=J708311001&FormatDate=iso" -o public/data/height.json

      # 5. Construire le projet (si nécessaire)
      - name: Build project
        run: npm run build # Remplacez par la commande de build de votre projet

      # 6. Déployer sur GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Dossier à publier (changez selon votre configuration)
